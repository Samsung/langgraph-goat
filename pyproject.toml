[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-goat"
version = "1.0.0"
description = "Graph of Agentic Thoughts: Bridging Agentic Reasoning and Explainability through Graphs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Himanshu Shekhar", email = "h.shekhar@samsung.com" },
    { name = "Moushumi Mahato", email = "moushumi.m@samsung.com" },
    { name = "Javaid Nabi", email = "javaid.nabi@samsung.com" },
]
keywords = ["agents", "explainability", "counterfactual", "llm", "reasoning", "langgraph", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "networkx>=3.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "typing_extensions>=4.0",
]

[project.optional-dependencies]
graphviz = ["graphviz>=0.20"]
all = ["graphviz>=0.20"]
test = ["pytest>=8,<10", "pytest-cov", "pytest-socket"]
dev = ["pytest>=8,<10", "pytest-cov", "pytest-socket", "ruff"]

[project.urls]
Homepage = "https://github.com/Samsung/langgraph-goat"
Documentation = "https://github.com/Samsung/langgraph-goat/blob/main/README.md"
"Bug Tracker" = "https://github.com/Samsung/langgraph-goat/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["langgraph_goat*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]